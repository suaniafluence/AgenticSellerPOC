# Codecov configuration
# Docs: https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    # Report coverage movement on pull requests without turning the check red.
    # Coverage currently sits around 42%; flip `informational` to false once it
    # is high enough to enforce a threshold worth failing on.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  require_changes: false

ignore:
  - "tests/**"
